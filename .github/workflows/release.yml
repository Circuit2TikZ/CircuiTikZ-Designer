name: Release

# Triggered by the version tag that `npm version` pushes (see postversion in package.json).
on:
    push:
        tags: ["v*"]

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Check tag against package.json and changelog
              env:
                  TAG: ${{ github.ref_name }}
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  if [ "$TAG" != "v$VERSION" ]; then
                    echo "::error::Tag $TAG does not match package.json version v$VERSION"
                    exit 1
                  fi
                  # Release notes = the matching section of CHANGELOG.md
                  awk -v v="$VERSION" '
                    index($0, "## [" v "]") == 1 { found = 1; next }
                    found && /^## \[/ { exit }
                    found { print }
                  ' CHANGELOG.md > release-notes.md
                  if ! grep -q '[^[:space:]]' release-notes.md; then
                    echo "::error::No entry for $VERSION found in CHANGELOG.md"
                    exit 1
                  fi
                  echo "VERSION=$VERSION" >> "$GITHUB_ENV"

            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - name: Build
              run: npm run build

            - name: Package website
              run: (cd dist && zip -r "../circuitikz-designer-web-v$VERSION.zip" .)

            - name: Create GitHub release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ github.ref_name }}
              run: |
                  FLAGS=""
                  case "$VERSION" in *-*) FLAGS="--prerelease" ;; esac
                  gh release create "$TAG" "circuitikz-designer-web-v$VERSION.zip" \
                    --title "$TAG" --notes-file release-notes.md $FLAGS
